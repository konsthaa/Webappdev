<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade Calculator</title>
  </head>
  <body>
    <script>
      const score = Number(prompt("Enter your score for the course assessment (0-100):"));

      let grade;

      if (score >= 0 && score <= 39) {
        grade = 0;
      } else if (score >= 40 && score <= 51) {
        grade = 1;
      } else if (score >= 52 && score <= 63) {
        grade = 2;
      } else if (score >= 64 && score <= 75) {
        grade = 3;
      } else if (score >= 76 && score <= 87) {
        grade = 4;
      } else if (score >= 88 && score <= 100) {
        grade = 5;
      } else {
        document.write("<p>Invalid score. Please enter a value between 0 and 100.</p>");
      }

      if (grade !== undefined) {
        document.write("<p>Your grade is: " + grade + "</p>");
      }
    </script>
  </body>
</html>
