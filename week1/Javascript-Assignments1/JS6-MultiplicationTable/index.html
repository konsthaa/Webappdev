<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 6: Multiplication Table</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 30px;
            line-height: 1.6;
        }
        table {
            border-collapse: collapse;
            margin-top: 15px;
        }
        td {
            border: 1px solid #ccc;
            padding: 10px 15px;
            text-align: center;
            min-width: 30px;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

    <h1>Multiplication Table</h1>
